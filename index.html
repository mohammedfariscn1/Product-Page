<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product details page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="product-box">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Product-Image">
             <div class="details">
                <h1>Nike athletic shoe</h1>
                <p class="price">4,999</p>
                <p class="desc">Premium white and red athletic shoe for kids and adults</p>
                <button class="cart-btn">Add to cart</button>
             </div>
        </div>
        <div class="review_section">
            <h2>Customer Reviews</h2>
            <input type="hidden" id="reviewId"/>
               <input type="text" id="name" placeholder="Enter name"/>
               <textarea id="message" placeholder="Write review"></textarea>
               <button>Submit review</button>
               <div id="review-list"></div>
        </div>
    </div>
</body>
</html>
